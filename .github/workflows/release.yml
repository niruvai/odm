# Builds ODM.app on every push to main and publishes it as a GitHub Release.
# The app checks the latest release and offers "Update Now" to its users.
name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the build number is the commit count

      - name: Build universal ODM.app
        run: |
          chmod +x build.sh
          UNIVERSAL=1 ./build.sh
          ditto -c -k --keepParent build/ODM.app build/ODM.zip
          echo "BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      # ODM.dmg is for people downloading by hand: open it and drag ODM onto Applications.
      # ODM.zip stays for the in-app updater. If the styled DMG fails, fall back to a plain one.
      - name: Make ODM.dmg
        run: |
          if ! npx --yes appdmg@0.6.6 Resources/dmg/appdmg.json build/ODM.dmg; then
            echo "Styled DMG failed; building a plain one."
            rm -f build/ODM.dmg
            mkdir -p build/dmg && cp -R build/ODM.app build/dmg/ && ln -s /Applications build/dmg/Applications
            hdiutil create -volname ODM -srcfolder build/dmg -ov -format UDZO build/ODM.dmg
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "build-$BUILD" >/dev/null 2>&1; then
            echo "Release build-$BUILD already exists; nothing to publish."
            exit 0
          fi
          git log -1 --pretty=%B > notes.txt
          gh release create "build-$BUILD" build/ODM.dmg build/ODM.zip \
            --title "ODM build $BUILD" \
            --notes-file notes.txt \
            --latest
